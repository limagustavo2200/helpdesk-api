databaseChangeLog:
  - changeSet:
      id: 0001-create-tables
      author: gustavo
      changes:

        - createTable:
            tableName: status
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - createTable:
            tableName: subcategory
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - createTable:
            tableName: ti_sector
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - createTable:
            tableName: system
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - createTable:
            tableName: assignee
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - createTable:
            tableName: ticket
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: ticket_number
                  type: integer
                  autoIncrement: true
                  constraints:
                    nullable: false
                    unique: true

              # Requester (Embedded)
              - column:
                  name: username
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: sector
                  type: text
                  constraints:
                    nullable: false

              # Ticket fields
              - column:
                  name: title
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: text

              - column:
                  name: priority
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: resolution_note
                  type: text

              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: timestamp

              - column:
                  name: finished_at
                  type: timestamp

              # FKs
              - column:
                  name: status_id
                  type: varchar(36)
                  constraints:
                    nullable: false

              - column:
                  name: system_id
                  type: varchar(36)
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: varchar(36)
                  constraints:
                    nullable: false

              - column:
                  name: subcategory_id
                  type: varchar(36)
                  constraints:
                    nullable: false

              - column:
                  name: ti_sector_id
                  type: varchar(36)

              - column:
                  name: assignee_id
                  type: varchar(36)

  - changeSet:
      id: 0002-create-ticket-fks
      author: gustavo
      changes:

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: status_id
            referencedTableName: status
            referencedColumnNames: id
            constraintName: fk_ticket_status

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: system_id
            referencedTableName: system
            referencedColumnNames: id
            constraintName: fk_ticket_system

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_ticket_category

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: subcategory_id
            referencedTableName: subcategory
            referencedColumnNames: id
            constraintName: fk_ticket_subcategory

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: ti_sector_id
            referencedTableName: ti_sector
            referencedColumnNames: id
            constraintName: fk_ticket_ti_sector

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: assignee_id
            referencedTableName: assignee
            referencedColumnNames: id
            constraintName: fk_ticket_assignee
